name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.2.0）"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing 需要 >= 11.5.1)
        run: npm install -g npm@latest

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            git checkout "refs/tags/${TAG}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.version }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json 版本 ($PKG) 与 tag ($TAG) 不一致"
            exit 1
          fi
          echo "version ok: $PKG"

      - name: Check if version already exists on npm
        id: exists
        run: |
          if npm view "opencode-effort-discovery@${{ steps.tag.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.tag.outputs.version }} 已在 npm 上，跳过发布，只创建 Release"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.exists.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Check published version
        run: |
          version="${{ steps.tag.outputs.version }}"
          for attempt in $(seq 1 20); do
            if npm view "opencode-effort-discovery@${version}" version >/dev/null 2>&1; then
              echo "registry ok: ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: not visible yet, waiting 15s"
            sleep 15
          done
          echo "::error::${version} 在 npm 上仍不可见"
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes \
            --verify-tag