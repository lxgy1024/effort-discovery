name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.3.0）"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing 需要 >= 11.5.1)
        run: npm install -g npm@latest

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            git checkout "refs/tags/${TAG}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Publish packages at tag version
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          version="${{ steps.tag.outputs.version }}"
          published=0
          for manifest in packages/*/package.json; do
            dir="$(dirname "$manifest")"
            name="$(node -p "require('./$manifest').name")"
            pkgver="$(node -p "require('./$manifest').version")"
            [ "$pkgver" = "$version" ] || { echo "skip $name (version $pkgver != $version)"; continue; }
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "$name@$version 已存在，跳过"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$dir" && npm publish --provenance --access public)
            published=$((published + 1))
          done
          echo "published=${published}" >> "$GITHUB_OUTPUT"

      - name: Wait for registry visibility
        continue-on-error: true
        run: |
          version="${{ steps.tag.outputs.version }}"
          for manifest in packages/*/package.json; do
            name="$(node -p "require('./$manifest').name")"
            [ "$(node -p "require('./$manifest').version")" = "$version" ] || continue
            for attempt in $(seq 1 20); do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "$name@$version visible"
                break
              fi
              echo "$name@$version attempt $attempt: waiting 15s"
              [ "$attempt" = "20" ] && echo "::warning::${name}@${version} 仍不可见（传播延迟），继续创建 Release"
              sleep 15
            done
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag